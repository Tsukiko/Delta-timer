<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeltaTimer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      color: #fff;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    #capsule {
      width: 100%;
      height: 100%;
      background: rgba(14, 19, 26, 0.82);
      border: 1.5px solid rgba(0, 255, 157, 0.45);
      border-radius: 10px;
      padding: 6px 12px;
      display: flex;
      flex-direction: column;
      transition: background 0.15s, border-color 0.15s;
    }

    /* 幽灵纯字模式 (F8) */
    body.ghost-mode #capsule {
      background: rgba(0, 0, 0, 0.01) !important;
      border-color: transparent !important;
    }
    body.ghost-mode .hide-on-ghost,
    body.ghost-mode #drawer {
      display: none !important;
    }
    /* 纯字模式下仅保留一个半透明小恢复按钮，防止找不到入口 */
    #restoreGhostBtn {
      display: none;
      position: fixed;
      top: 4px;
      right: 6px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(0, 255, 157, 0.5);
      color: #00ff9d;
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 4px;
      cursor: pointer;
    }
    body.ghost-mode #restoreGhostBtn {
      display: block;
    }

    /* 顶部栏 */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 4px;
      margin-bottom: 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    .drag-handle {
      flex: 1;
      font-size: 12px;
      color: #cbd5e1;
      cursor: move;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 2px 0;
      text-shadow: 0 1px 2px #000;
    }
    .drag-handle:hover {
      color: #00ff9d;
    }

    .sync-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00ff9d;
      box-shadow: 0 0 6px #00ff9d;
    }
    .sync-dot.error {
      background: #ff3b3b;
      box-shadow: 0 0 8px #ff3b3b;
    }

    .status-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .icon-btn {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.4);
      color: #f1f5f9;
      font-size: 12px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
    }
    .icon-btn:hover {
      background: #00ff9d;
      color: #000;
      border-color: #00ff9d;
    }
    .icon-btn.close:hover {
      background: #ef4444;
      color: #fff;
      border-color: #ef4444;
    }

    /* 第一行：北京时间大字（加厚黑色轮廓描边，透明背景下也极其清晰） */
    .row-clock {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    .clock-digits {
      font-family: "Consolas", "Microsoft YaHei", monospace;
      font-size: 32px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 0 3px #000, 0 2px 4px #000, 1px 1px 0 #000, -1px -1px 0 #000;
      line-height: 1.05;
    }

    .clock-ms {
      font-size: 20px;
      color: #00ff9d;
      margin-left: 2px;
    }

    /* 第二行：主倒计时 + 快捷按钮 */
    .row-timer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 6px;
    }

    .timer-digits {
      font-family: "Consolas", "Microsoft YaHei", monospace;
      font-size: 28px;
      font-weight: 900;
      color: #38bdf8;
      text-shadow: 0 0 3px #000, 0 2px 4px #000, 1px 1px 0 #000, -1px -1px 0 #000;
      line-height: 1.05;
    }
    .timer-digits.warn { color: #facc15; }
    .timer-digits.go { color: #4ade80; }

    .timer-ms { font-size: 18px; }

    .quick-actions {
      display: flex;
      gap: 5px;
    }

    .q-btn {
      background: rgba(30, 58, 95, 0.85);
      border: 1px solid #38bdf8;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 5px;
      cursor: pointer;
    }
    .q-btn:hover { background: #0284c7; }
    .q-btn.active {
      background: #00ff9d;
      color: #090d16;
      border-color: #00ff9d;
    }

    /* 设置抽屉 */
    #drawer {
      display: none;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 12px;
    }
    #drawer.open { display: block; }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
      text-shadow: 0 1px 2px #000;
    }

    .setting-input {
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid #475569;
      color: #fff;
      font-family: monospace;
      font-size: 13px;
      font-weight: bold;
      padding: 3px 6px;
      border-radius: 4px;
      width: 110px;
      text-align: center;
    }
  </style>
</head>
<body>
  <button id="restoreGhostBtn" onclick="toggleGhostMode()">还原(F8)</button>

  <div id="capsule">
    <div class="top-bar hide-on-ghost">
      <div class="drag-handle" id="dragBar" data-tauri-drag-region>
        <span id="syncDot" class="sync-dot"></span>
        <span data-tauri-drag-region>✥ 按住拖动</span>
      </div>
      <div class="status-group">
        <button class="icon-btn" onclick="syncNetworkTime()">校准</button>
        <button class="icon-btn" onclick="toggleGhostMode()">纯字</button>
        <button class="icon-btn" onclick="toggleDrawer()">⚙设置</button>
        <button class="icon-btn close" onclick="closeApp()">✕</button>
      </div>
    </div>

    <div class="row-clock">
      <div class="clock-digits" data-tauri-drag-region>
        <span id="bjHMS">00:00:00</span><span class="clock-ms" id="bjMS">.000</span>
      </div>
    </div>

    <div class="row-timer">
      <div id="timerDisplay" class="timer-digits">
        <span id="cdHMS">00:00:00</span><span class="timer-ms" id="cdMS">.000</span>
      </div>
      <div class="quick-actions hide-on-ghost">
        <button class="q-btn" onclick="setQuickTarget('min')">整分</button>
        <button class="q-btn" onclick="setQuickTarget('half')">半点</button>
        <button id="toggleBtn" class="q-btn" onclick="toggleTimer()">启动</button>
      </div>
    </div>

    <div id="drawer">
      <div class="setting-row">
        <span>定点发车:</span>
        <input id="targetInput" class="setting-input" type="text" value="20:00:00.000" />
        <button class="q-btn" onclick="applyCustomTarget()">设定</button>
      </div>

      <div class="setting-row">
        <span>背景透明度: <b id="alphaVal" style="color:#00ff9d">82%</b></span>
        <input id="alphaSlider" type="range" min="0" max="100" step="5" value="82" style="width:130px" oninput="updateAlpha(this.value)" />
      </div>

      <div class="setting-row">
        <span>延迟补偿: <b id="offsetVal" style="color:#facc15">-150ms</b></span>
        <input id="offsetSlider" type="range" min="-500" max="500" step="10" value="-150" style="width:130px" oninput="updateOffset(this.value)" />
      </div>

      <div class="setting-row">
        <span>提示音量:</span>
        <input id="volSlider" type="range" min="0" max="100" value="80" style="width:100px" oninput="updateVol(this.value)" />
        <button class="icon-btn" onclick="playBeep(880, 0.12)">试听</button>
      </div>
    </div>
  </div>

  <script>
    let timeOffsetMs = 0;
    let userLatencyMs = Number(localStorage.getItem('delta_offset') ?? -150);
    let volume = Number(localStorage.getItem('delta_vol') ?? 0.8);
    let bgAlpha = Number(localStorage.getItem('delta_alpha') ?? 82);
    let targetTimestamp = 0;
    let isRunning = false;
    let lastBeepSec = -1;
    let audioCtx = null;

    document.getElementById('offsetSlider').value = userLatencyMs;
    document.getElementById('offsetVal').innerText = (userLatencyMs >= 0 ? '+' : '') + userLatencyMs + 'ms';
    document.getElementById('volSlider').value = Math.round(volume * 100);
    document.getElementById('alphaSlider').value = bgAlpha;
    updateAlpha(bgAlpha);

    document.getElementById('dragBar').addEventListener('mousedown', (e) => {
      if (e.button === 0 && window.__TAURI__ && window.__TAURI__.window) {
        window.__TAURI__.window.appWindow.startDragging().catch(() => {});
      }
    });

    function updateAlpha(val) {
      bgAlpha = Number(val);
      localStorage.setItem('delta_alpha', bgAlpha);
      document.getElementById('alphaVal').innerText = bgAlpha + '%';
      const capsule = document.getElementById('capsule');
      // 保留至少 0.01 透明度防止部分显卡驱动丢焦点
      const realAlpha = Math.max(0.01, bgAlpha / 100);
      capsule.style.background = `rgba(14, 19, 26, ${realAlpha})`;
      capsule.style.borderColor = bgAlpha === 0 ? 'transparent' : `rgba(0, 255, 157, ${Math.min(0.5, realAlpha)})`;
    }

    function playBeep(freq = 880, duration = 0.1) {
      if (volume <= 0) return;
      try {
        if (!audioCtx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) audioCtx = new AudioCtx();
        }
        if (!audioCtx) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(volume * 0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    async function fetchWithTimeout(url, timeout = 2200) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeout);
      try {
        const res = await fetch(url, { cache: 'no-store', signal: controller.signal });
        clearTimeout(timer);
        return res;
      } catch (err) {
        clearTimeout(timer);
        throw err;
      }
    }

    async function syncNetworkTime() {
      const dot = document.getElementById('syncDot');
      const sources = [
        { url: 'https://acs.m.taobao.com/gw/mtop.common.getTimestamp/', parse: d => Number(d?.data?.t) },
        { url: 'https://f.m.suning.com/api/ct.do', parse: d => Number(d?.currentTime) },
        { url: 'https://api.pinduoduo.com/api/server/_stm', parse: d => Number(d?.server_time) }
      ];

      for (const src of sources) {
        try {
          const t0 = performance.now();
          const res = await fetchWithTimeout(src.url, 2000);
          const t1 = performance.now();
          const data = await res.json();
          const serverMs = src.parse(data);
          if (serverMs && serverMs > 1700000000000) {
            const rttHalf = (t1 - t0) / 2;
            timeOffsetMs = Math.round(serverMs + rttHalf - Date.now());
            dot.classList.remove('error');
            return;
          }
        } catch (e) {}
      }
      dot.classList.add('error');
    }

    function getNowBJ() {
      return new Date(Date.now() + timeOffsetMs);
    }

    function pad(n, len = 2) {
      return String(n).padStart(len, '0');
    }

    function setQuickTarget(type) {
      const now = getNowBJ();
      const next = new Date(now.getTime());
      if (type === 'min') {
        next.setMinutes(now.getMinutes() + 1, 0, 0);
      } else {
        if (now.getSeconds() < 30) next.setSeconds(30, 0);
        else next.setMinutes(now.getMinutes() + 1, 0, 0);
      }
      targetTimestamp = next.getTime();
      document.getElementById('targetInput').value =
        `${pad(next.getHours())}:${pad(next.getMinutes())}:${pad(next.getSeconds())}.000`;
      startTimer();
    }

    function applyCustomTarget() {
      const raw = document.getElementById('targetInput').value.trim();
      const [hms, ms = '0'] = raw.split('.');
      const [h, m, s] = hms.split(':').map(Number);
      const now = getNowBJ();
      const target = new Date(now.getTime());
      target.setHours(h || 0, m || 0, s || 0, Number(String(ms).padEnd(3, '0')));
      if (target.getTime() <= now.getTime()) target.setDate(target.getDate() + 1);
      targetTimestamp = target.getTime();
      startTimer();
    }

    function startTimer() {
      isRunning = true;
      lastBeepSec = -1;
      const btn = document.getElementById('toggleBtn');
      btn.innerText = '停止';
      btn.classList.add('active');
    }

    function toggleTimer() {
      if (!isRunning) {
        if (!targetTimestamp || targetTimestamp <= getNowBJ().getTime()) setQuickTarget('min');
        else startTimer();
      } else {
        isRunning = false;
        const btn = document.getElementById('toggleBtn');
        btn.innerText = '启动';
        btn.classList.remove('active');
      }
    }

    function updateOffset(val) {
      userLatencyMs = Number(val);
      localStorage.setItem('delta_offset', userLatencyMs);
      document.getElementById('offsetVal').innerText = (userLatencyMs >= 0 ? '+' : '') + userLatencyMs + 'ms';
    }

    function updateVol(val) {
      volume = Number(val) / 100;
      localStorage.setItem('delta_vol', volume);
    }

    async function toggleDrawer() {
      const drawer = document.getElementById('drawer');
      const isOpen = drawer.classList.toggle('open');
      try {
        if (window.__TAURI__ && window.__TAURI__.window) {
          const LogicalSize = window.__TAURI__.window.LogicalSize;
          await window.__TAURI__.window.appWindow.setSize(new LogicalSize(355, isOpen ? 265 : 125));
        }
      } catch (e) {}
    }

    async function toggleGhostMode() {
      const isGhost = document.body.classList.toggle('ghost-mode');
      if (isGhost) {
        document.getElementById('drawer').classList.remove('open');
        try {
          if (window.__TAURI__ && window.__TAURI__.window) {
            const LogicalSize = window.__TAURI__.window.LogicalSize;
            await window.__TAURI__.window.appWindow.setSize(new LogicalSize(355, 100));
          }
        } catch (e) {}
      } else {
        updateAlpha(bgAlpha);
        try {
          if (window.__TAURI__ && window.__TAURI__.window) {
            const LogicalSize = window.__TAURI__.window.LogicalSize;
            await window.__TAURI__.window.appWindow.setSize(new LogicalSize(355, 125));
          }
        } catch (e) {}
      }
    }

    function closeApp() {
      if (window.__TAURI__ && window.__TAURI__.window) {
        window.__TAURI__.window.appWindow.close();
      } else {
        window.close();
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'F5') { e.preventDefault(); syncNetworkTime(); }
      if (e.key === 'F6') {
        e.preventDefault();
        isRunning = false;
        document.getElementById('cdHMS').innerText = '00:00:00';
        document.getElementById('cdMS').innerText = '.000';
      }
      if (e.key === 'F7') { e.preventDefault(); toggleTimer(); }
      if (e.key === 'F8') { e.preventDefault(); toggleGhostMode(); }
    });

    function tick() {
      const now = getNowBJ();
      document.getElementById('bjHMS').innerText = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      document.getElementById('bjMS').innerText = `.${pad(now.getMilliseconds(), 3)}`;

      if (isRunning && targetTimestamp > 0) {
        const effectiveTarget = targetTimestamp + userLatencyMs;
        const diff = effectiveTarget - now.getTime();
        const box = document.getElementById('timerDisplay');

        if (diff > 0) {
          const secLeft = Math.ceil(diff / 1000);
          if (secLeft <= 3 && secLeft !== lastBeepSec) {
            lastBeepSec = secLeft;
            playBeep(780, 0.09);
            box.className = 'timer-digits warn';
          } else if (secLeft > 3) {
            box.className = 'timer-digits';
          }
          const h = Math.floor(diff / 3600000);
          const m = Math.floor((diff % 3600000) / 60000);
          const s = Math.floor((diff % 60000) / 1000);
          const ms = diff % 1000;
          document.getElementById('cdHMS').innerText = `${pad(h)}:${pad(m)}:${pad(s)}`;
          document.getElementById('cdMS').innerText = `.${pad(ms, 3)}`;
        } else {
          isRunning = false;
          playBeep(1320, 0.35);
          box.className = 'timer-digits go';
          document.getElementById('cdHMS').innerText = '00:00:00';
          document.getElementById('cdMS').innerText = '.000';
          const btn = document.getElementById('toggleBtn');
          btn.innerText = '启动';
          btn.classList.remove('active');
        }
      }
      requestAnimationFrame(tick);
    }

    syncNetworkTime();
    setInterval(syncNetworkTime, 45000);
    requestAnimationFrame(tick);
  </script>
</body>
</html>
