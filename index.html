<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeltaTimer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0e131a;
      color: #fff;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    #capsule {
      width: 100%;
      height: 100%;
      background: #0e131a;
      border: 1.5px solid rgba(0, 255, 157, 0.5);
      padding: 6px 12px;
      display: flex;
      flex-direction: column;
    }

    /* 顶部栏 */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 4px;
      margin-bottom: 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .drag-handle {
      flex: 1;
      font-size: 12px;
      color: #94a3b8;
      cursor: move;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 2px 0;
    }
    .drag-handle:hover {
      color: #00ff9d;
    }

    .sync-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00ff9d;
      box-shadow: 0 0 6px #00ff9d;
    }
    .sync-dot.error {
      background: #ff3b3b;
      box-shadow: 0 0 8px #ff3b3b;
    }

    .status-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .icon-btn {
      background: #1e293b;
      border: 1px solid #475569;
      color: #e2e8f0;
      font-size: 12px;
      font-weight: bold;
      padding: 2px 7px;
      border-radius: 4px;
      cursor: pointer;
    }
    .icon-btn:hover {
      background: #00ff9d;
      color: #000;
      border-color: #00ff9d;
    }
    .icon-btn.close:hover {
      background: #ef4444;
      color: #fff;
      border-color: #ef4444;
    }

    /* 第一行：北京时间大字 */
    .row-clock {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    .clock-digits {
      font-family: "Consolas", "Microsoft YaHei", monospace;
      font-size: 32px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.05;
    }

    .clock-ms {
      font-size: 20px;
      color: #00ff9d;
      margin-left: 2px;
    }

    /* 第二行：主倒计时 + 快捷按钮 */
    .row-timer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 6px;
    }

    .timer-digits {
      font-family: "Consolas", "Microsoft YaHei", monospace;
      font-size: 28px;
      font-weight: 900;
      color: #38bdf8;
      line-height: 1.05;
    }
    .timer-digits.warn { color: #facc15; }
    .timer-digits.go { color: #4ade80; }

    .timer-ms { font-size: 18px; }

    .quick-actions {
      display: flex;
      gap: 5px;
    }

    .q-btn {
      background: #1e3a5f;
      border: 1px solid #38bdf8;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 5px;
      cursor: pointer;
    }
    .q-btn:hover { background: #0284c7; }
    .q-btn.active {
      background: #00ff9d;
      color: #090d16;
      border-color: #00ff9d;
    }

    /* 设置与日志抽屉 */
    #drawer {
      display: none;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 12px;
    }
    #drawer.open { display: block; }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .setting-input {
      background: #000;
      border: 1px solid #475569;
      color: #fff;
      font-family: monospace;
      font-size: 13px;
      font-weight: bold;
      padding: 3px 6px;
      border-radius: 4px;
      width: 110px;
      text-align: center;
    }

    #logBox {
      margin-top: 6px;
      background: #000;
      border: 1px solid #334155;
      color: #4ade80;
      font-family: Consolas, monospace;
      font-size: 11px;
      height: 85px;
      overflow-y: auto;
      padding: 4px;
      user-select: text;
      -webkit-user-select: text;
    }
  </style>
</head>
<body>
  <div id="capsule">
    <div class="top-bar">
      <div class="drag-handle" id="dragBar" data-tauri-drag-region>
        <span id="syncDot" class="sync-dot"></span>
        <span data-tauri-drag-region>✥ 按住拖动</span>
      </div>
      <div class="status-group">
        <button class="icon-btn" onclick="syncNetworkTime()">校准</button>
        <button class="icon-btn" onclick="toggleDrawer()">⚙设置/日志</button>
        <button class="icon-btn close" onclick="closeApp()">✕</button>
      </div>
    </div>

    <div class="row-clock">
      <div class="clock-digits">
        <span id="bjHMS">00:00:00</span><span class="clock-ms" id="bjMS">.000</span>
      </div>
    </div>

    <div class="row-timer">
      <div id="timerDisplay" class="timer-digits">
        <span id="cdHMS">00:00:00</span><span class="timer-ms" id="cdMS">.000</span>
      </div>
      <div class="quick-actions">
        <button class="q-btn" onclick="setQuickTarget('min')">整分</button>
        <button class="q-btn" onclick="setQuickTarget('half')">半点</button>
        <button id="toggleBtn" class="q-btn" onclick="toggleTimer()">启动</button>
      </div>
    </div>

    <div id="drawer">
      <div class="setting-row">
        <span>定点发车:</span>
        <input id="targetInput" class="setting-input" type="text" value="20:00:00.000" />
        <button class="q-btn" onclick="applyCustomTarget()">设定</button>
      </div>

      <div class="setting-row">
        <span>延迟补偿: <b id="offsetVal" style="color:#facc15">-150ms</b></span>
        <input id="offsetSlider" type="range" min="-500" max="500" step="10" value="-150" style="width:130px" oninput="updateOffset(this.value)" />
      </div>

      <div class="setting-row">
        <span>提示音量:</span>
        <input id="volSlider" type="range" min="0" max="100" value="80" style="width:100px" oninput="updateVol(this.value)" />
        <button class="icon-btn" onclick="playBeep(880, 0.12)">试听</button>
      </div>

      <div style="font-size:11px; color:#94a3b8; margin-top:2px;">
        实时运行日志（已同步写入桌面 DeltaTimer_Debug.log）：
      </div>
      <div id="logBox"></div>
    </div>
  </div>

  <script>
    // 双通道日志系统：同时写入界面与电脑桌面 DeltaTimer_Debug.log
    function writeLog(msg) {
      const now = new Date();
      const timeStr = now.toTimeString().split(' ')[0] + '.' + String(now.getMilliseconds()).padStart(3, '0');
      const line = `[${timeStr}] ${msg}`;
      try {
        const box = document.getElementById('logBox');
        if (box) {
          const div = document.createElement('div');
          div.textContent = line;
          box.appendChild(div);
          box.scrollTop = box.scrollHeight;
        }
      } catch (e) {}

      try {
        if (window.__TAURI__ && window.__TAURI__.tauri) {
          window.__TAURI__.tauri.invoke('log_to_file', { msg: line }).catch(() => {});
        }
      } catch (e) {}
    }

    window.onerror = function(msg, src, line, col) {
      writeLog(`ERROR: ${msg} (line:${line})`);
      return true;
    };
    window.onunhandledrejection = function(e) {
      writeLog(`PROMISE ERR: ${e?.reason || 'unknown'}`);
      return true;
    };

    writeLog('前端界面初始化开始...');

    let timeOffsetMs = 0;
    let userLatencyMs = -150;
    let volume = 0.8;
    let targetTimestamp = 0;
    let isRunning = false;
    let lastBeepSec = -1;
    let audioCtx = null;

    // 每秒打一次存活心跳日志，方便排查闪退精确时间点
    let aliveSec = 0;
    setInterval(() => {
      aliveSec++;
      if (aliveSec <= 15 || aliveSec % 10 === 0) {
        writeLog(`Heartbeat alive: ${aliveSec}s`);
      }
    }, 1000);

    document.getElementById('dragBar').addEventListener('mousedown', (e) => {
      if (e.button === 0 && window.__TAURI__ && window.__TAURI__.window) {
        writeLog('触发窗口拖拽');
        window.__TAURI__.window.appWindow.startDragging().catch(err => writeLog('拖拽异常:' + err));
      }
    });

    function playBeep(freq = 880, duration = 0.1) {
      writeLog(`播放提示音 freq=${freq}`);
      if (volume <= 0) return;
      try {
        if (!audioCtx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) audioCtx = new AudioCtx();
        }
        if (!audioCtx) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(volume * 0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        writeLog('音频异常: ' + e.message);
      }
    }

    async function fetchWithTimeout(url, timeout = 2200) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeout);
      try {
        const res = await fetch(url, { cache: 'no-store', signal: controller.signal });
        clearTimeout(timer);
        return res;
      } catch (err) {
        clearTimeout(timer);
        throw err;
      }
    }

    async function syncNetworkTime() {
      writeLog('开始请求网络北京时间...');
      const dot = document.getElementById('syncDot');
      const sources = [
        { name: '淘宝', url: 'https://acs.m.taobao.com/gw/mtop.common.getTimestamp/', parse: d => Number(d?.data?.t) },
        { name: '苏宁', url: 'https://f.m.suning.com/api/ct.do', parse: d => Number(d?.currentTime) },
        { name: '拼多多', url: 'https://api.pinduoduo.com/api/server/_stm', parse: d => Number(d?.server_time) }
      ];

      for (const src of sources) {
        try {
          const t0 = performance.now();
          const res = await fetchWithTimeout(src.url, 2000);
          const t1 = performance.now();
          const data = await res.json();
          const serverMs = src.parse(data);
          if (serverMs && serverMs > 1700000000000) {
            const rttHalf = (t1 - t0) / 2;
            timeOffsetMs = Math.round(serverMs + rttHalf - Date.now());
            dot.classList.remove('error');
            writeLog(`${src.name}授时成功! 偏差=${timeOffsetMs}ms, RTT=${Math.round(t1 - t0)}ms`);
            return;
          }
        } catch (e) {
          writeLog(`${src.name}源不可用: ${e.message || '跨域或超时'}`);
        }
      }
      dot.classList.add('error');
      writeLog('所有在线源均被拦截，降级使用系统时间');
    }

    function getNowBJ() {
      return new Date(Date.now() + timeOffsetMs);
    }

    function pad(n, len = 2) {
      return String(n).padStart(len, '0');
    }

    function setQuickTarget(type) {
      const now = getNowBJ();
      const next = new Date(now.getTime());
      if (type === 'min') {
        next.setMinutes(now.getMinutes() + 1, 0, 0);
      } else {
        if (now.getSeconds() < 30) next.setSeconds(30, 0);
        else next.setMinutes(now.getMinutes() + 1, 0, 0);
      }
      targetTimestamp = next.getTime();
      const str = `${pad(next.getHours())}:${pad(next.getMinutes())}:${pad(next.getSeconds())}.000`;
      document.getElementById('targetInput').value = str;
      writeLog(`点击快捷目标 [${type}] -> ${str}`);
      startTimer();
    }

    function applyCustomTarget() {
      const raw = document.getElementById('targetInput').value.trim();
      const [hms, ms = '0'] = raw.split('.');
      const [h, m, s] = hms.split(':').map(Number);
      const now = getNowBJ();
      const target = new Date(now.getTime());
      target.setHours(h || 0, m || 0, s || 0, Number(String(ms).padEnd(3, '0')));
      if (target.getTime() <= now.getTime()) target.setDate(target.getDate() + 1);
      targetTimestamp = target.getTime();
      writeLog(`设定自定义目标 -> ${raw}`);
      startTimer();
    }

    function startTimer() {
      isRunning = true;
      lastBeepSec = -1;
      const btn = document.getElementById('toggleBtn');
      btn.innerText = '停止';
      btn.classList.add('active');
    }

    function toggleTimer() {
      writeLog('点击启停按钮');
      if (!isRunning) {
        if (!targetTimestamp || targetTimestamp <= getNowBJ().getTime()) setQuickTarget('min');
        else startTimer();
      } else {
        isRunning = false;
        const btn = document.getElementById('toggleBtn');
        btn.innerText = '启动';
        btn.classList.remove('active');
      }
    }

    function updateOffset(val) {
      userLatencyMs = Number(val);
      document.getElementById('offsetVal').innerText = (userLatencyMs >= 0 ? '+' : '') + userLatencyMs + 'ms';
      writeLog(`调整延迟补偿: ${userLatencyMs}ms`);
    }

    function updateVol(val) {
      volume = Number(val) / 100;
    }

    async function toggleDrawer() {
      const drawer = document.getElementById('drawer');
      const isOpen = drawer.classList.toggle('open');
      writeLog(`展开设置与日志面板: ${isOpen}`);
      try {
        if (window.__TAURI__ && window.__TAURI__.window) {
          const LogicalSize = window.__TAURI__.window.LogicalSize;
          await window.__TAURI__.window.appWindow.setSize(new LogicalSize(355, isOpen ? 340 : 125));
        }
      } catch (e) {
        writeLog('调整窗口尺寸失败: ' + e.message);
      }
    }

    function closeApp() {
      writeLog('用户点击关闭按钮');
      if (window.__TAURI__ && window.__TAURI__.window) {
        window.__TAURI__.window.appWindow.close();
      } else {
        window.close();
      }
    }

    function tick() {
      const now = getNowBJ();
      document.getElementById('bjHMS').innerText = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      document.getElementById('bjMS').innerText = `.${pad(now.getMilliseconds(), 3)}`;

      if (isRunning && targetTimestamp > 0) {
        const effectiveTarget = targetTimestamp + userLatencyMs;
        const diff = effectiveTarget - now.getTime();
        const box = document.getElementById('timerDisplay');

        if (diff > 0) {
          const secLeft = Math.ceil(diff / 1000);
          if (secLeft <= 3 && secLeft !== lastBeepSec) {
            lastBeepSec = secLeft;
            playBeep(780, 0.09);
            box.className = 'timer-digits warn';
          } else if (secLeft > 3) {
            box.className = 'timer-digits';
          }
          const h = Math.floor(diff / 3600000);
          const m = Math.floor((diff % 3600000) / 60000);
          const s = Math.floor((diff % 60000) / 1000);
          const ms = diff % 1000;
          document.getElementById('cdHMS').innerText = `${pad(h)}:${pad(m)}:${pad(s)}`;
          document.getElementById('cdMS').innerText = `.${pad(ms, 3)}`;
        } else {
          isRunning = false;
          writeLog('倒计时归零，触发发车提示音！');
          playBeep(1320, 0.35);
          box.className = 'timer-digits go';
          document.getElementById('cdHMS').innerText = '00:00:00';
          document.getElementById('cdMS').innerText = '.000';
          const btn = document.getElementById('toggleBtn');
          btn.innerText = '启动';
          btn.classList.remove('active');
        }
      }
      requestAnimationFrame(tick);
    }

    syncNetworkTime();
    setInterval(syncNetworkTime, 45000);
    requestAnimationFrame(tick);
  </script>
</body>
</html>
