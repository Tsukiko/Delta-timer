name: Auto Generate & Build EXE (Only index.html needed)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Auto Scaffold Tauri Project & Inject HTML
        shell: powershell
        run: |
          npm install -g @tauri-apps/cli@^1.5.0
          mkdir dist
          Copy-Item index.html dist/index.html
          tauri init --app-name DeltaTimer --window-title DeltaTimer --dist-dir ../dist --dev-path ../dist --ci
          
          # 修改配置为透明、无边框、置顶
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.build.withGlobalTauri = $true
          $conf.tauri.allowlist.window = @{ all = $true; startDragging = $true; close = $true }
          $conf.tauri.windows[0].width = 365
          $conf.tauri.windows[0].height = 290
          $conf.tauri.windows[0].decorations = $false
          $conf.tauri.windows[0].transparent = $true
          $conf.tauri.windows[0].alwaysOnTop = $true
          $conf.tauri.bundle.identifier = "com.deltatimer.hud"
          $conf | ConvertTo-Json -Depth 10 | Set-Content src-tauri/tauri.conf.json

      - name: Build EXE
        run: tauri build

      - name: Upload Portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: DeltaTimer-EXE
          path: |
            src-tauri/target/release/DeltaTimer.exe
            src-tauri/target/release/bundle/nsis/*.exe
