name: Auto Generate & Build EXE (Only index.html needed)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Auto Scaffold Tauri Project & Inject HTML
        shell: powershell
        run: |
          npm install -g @tauri-apps/cli@^1.5.0
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item index.html dist/index.html
          tauri init --app-name DeltaTimer --window-title DeltaTimer --dist-dir ../dist --dev-path ../dist --ci

          $json = @'
          {
            "build": {
              "beforeBuildCommand": "",
              "beforeDevCommand": "",
              "devPath": "../dist",
              "distDir": "../dist",
              "withGlobalTauri": true
            },
            "package": {
              "productName": "DeltaTimer",
              "version": "1.0.0"
            },
            "tauri": {
              "allowlist": {
                "all": false,
                "window": {
                  "all": true,
                  "close": true,
                  "startDragging": true,
                  "setAlwaysOnTop": true,
                  "setIgnoreCursorEvents": true
                }
              },
              "bundle": {
                "active": true,
                "targets": ["msi", "nsis"],
                "identifier": "com.deltatimer.hud",
                "icon": [
                  "icons/32x32.png",
                  "icons/128x128.png",
                  "icons/icon.ico"
                ]
              },
              "security": {
                "csp": null
              },
              "windows": [
                {
                  "title": "DeltaTimer",
                  "width": 365,
                  "height": 290,
                  "resizable": false,
                  "decorations": false,
                  "transparent": true,
                  "alwaysOnTop": true,
                  "x": 20,
                  "y": 20
                }
              ]
            }
          }
          '@
          $json | Set-Content -Path "src-tauri/tauri.conf.json" -Encoding UTF8

      - name: Build EXE
        run: tauri build

      - name: Upload Portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: DeltaTimer-EXE
          path: |
            src-tauri/target/release/DeltaTimer.exe
            src-tauri/target/release/bundle/nsis/*.exe
