name: Auto Generate & Build EXE (With Crash Logger)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Auto Scaffold Tauri Project & Inject HTML
        shell: powershell
        run: |
          npm install -g @tauri-apps/cli@^1.5.0
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item index.html dist/index.html
          tauri init --app-name DeltaTimer --window-title DeltaTimer --dist-dir ../dist --dev-path ../dist --ci

          $json = @'
          {
            "build": {
              "beforeBuildCommand": "",
              "beforeDevCommand": "",
              "devPath": "../dist",
              "distDir": "../dist",
              "withGlobalTauri": true
            },
            "package": {
              "productName": "DeltaTimer",
              "version": "1.1.0"
            },
            "tauri": {
              "allowlist": {
                "all": true,
                "fs": {
                  "all": true,
                  "readFile": true,
                  "writeFile": true,
                  "createDir": true,
                  "scope": ["$DESKTOP/*", "$APPDATA/*", "**"]
                },
                "path": {
                  "all": true
                },
                "window": {
                  "all": true,
                  "close": true,
                  "startDragging": true,
                  "setAlwaysOnTop": true,
                  "setSize": true
                }
              },
              "bundle": {
                "active": true,
                "targets": ["msi", "nsis"],
                "identifier": "com.deltatimer.hud",
                "icon": [
                  "icons/32x32.png",
                  "icons/128x128.png",
                  "icons/icon.ico"
                ]
              },
              "security": {
                "csp": null
              },
              "windows": [
                {
                  "title": "DeltaTimer",
                  "width": 355,
                  "height": 125,
                  "resizable": true,
                  "decorations": false,
                  "transparent": false,
                  "alwaysOnTop": true,
                  "x": 30,
                  "y": 30
                }
              ]
            }
          }
          '@
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText("$PWD/src-tauri/tauri.conf.json", $json, $utf8NoBom)

      - name: Inject Rust Crash Logger & Disable WebView2 GPU Crash
        shell: powershell
        run: |
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false

          # 1. 开启 Cargo.toml 所有 API 特性
          $cargoPath = "$PWD/src-tauri/Cargo.toml"
          $cargo = Get-Content $cargoPath -Raw
          $cargo = $cargo -replace 'features = \[\]', 'features = ["api-all"]'
          [System.IO.File]::WriteAllText($cargoPath, $cargo, $utf8NoBom)

          # 2. 注入 Rust 底层日志与防崩溃 main.rs
          $mainRs = @'
          #![cfg_attr(not(debug_assertions), windows_subsystem = "windows")]

          use std::fs::OpenOptions;
          use std::io::Write;
          use std::panic;

          fn write_desktop_log(msg: &str) {
              if let Some(home) = std::env::var_os("USERPROFILE") {
                  let mut path = std::path::PathBuf::from(home);
                  path.push("Desktop");
                  path.push("DeltaTimer_Debug.log");
                  if let Ok(mut file) = OpenOptions::new().create(true).append(true).open(path) {
                      let _ = writeln!(file, "{}", msg);
                  }
              }
          }

          #[tauri::command]
          fn log_to_file(msg: String) {
              write_desktop_log(&format!("[JS] {}", msg));
          }

          fn main() {
              // 禁用 WebView2 透明合成 GPU 崩溃问题
              std::env::set_var("WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS", "--disable-gpu-compositing");

              write_desktop_log("==========================================");
              write_desktop_log("[RUST] Process starting up...");

              panic::set_hook(Box::new(|info| {
                  write_desktop_log(&format!("[RUST PANIC CRASH] {}", info));
              }));

              tauri::Builder::default()
                  .invoke_handler(tauri::generate_handler![log_to_file])
                  .setup(|_app| {
                      write_desktop_log("[RUST] Tauri window setup completed successfully.");
                      Ok(())
                  })
                  .on_window_event(|event| {
                      match event.event() {
                          tauri::WindowEvent::CloseRequested { .. } => {
                              write_desktop_log("[RUST] WindowEvent: CloseRequested triggered!");
                          }
                          tauri::WindowEvent::Destroyed => {
                              write_desktop_log("[RUST] WindowEvent: Destroyed triggered!");
                          }
                          _ => {}
                      }
                  })
                  .run(tauri::generate_context!())
                  .expect("error while running tauri application");
          }
          '@
          [System.IO.File]::WriteAllText("$PWD/src-tauri/src/main.rs", $mainRs, $utf8NoBom)

      - name: Build EXE
        run: tauri build

      - name: Upload Portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: DeltaTimer-EXE
          path: |
            src-tauri/target/release/DeltaTimer.exe
            src-tauri/target/release/bundle/nsis/*.exe
